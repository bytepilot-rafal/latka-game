<script>
  // Level picker (kept visible for testing). The game always opens on level 1: a pick is remembered only for the one
  // reload that follows it, and a ?level= in the address is ignored (except on the developer's own machine).
  var LEVEL = '1', QUALITY = 'high';
  // Picture quality: "high" (the default) adds fur, richer scenery and effects; "regular" is the lighter version. The choice is remembered.
  (function () {
    var q = null, p = new URLSearchParams(location.search).get('q');
    try { q = localStorage.getItem('latka-quality'); } catch (e) { /* storage blocked */ }
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && p) q = p;
    if (q === 'regular') QUALITY = 'regular';
    document.querySelectorAll('#quality button').forEach(function (b) {
      if (b.dataset.q === QUALITY) b.classList.add('cur');
      b.addEventListener('click', function () {
        if (b.dataset.q === QUALITY) return;
        try { localStorage.setItem('latka-quality', b.dataset.q); if (LEVEL !== '1') sessionStorage.setItem('latka-level', LEVEL); } catch (e) { /* storage blocked */ }
        if (location.search) history.replaceState(null, '', location.pathname);
        location.reload();
      });
    });
  })();
  (function () {
    var KEY = 'latka-level', q = new URLSearchParams(location.search).get('level'), dev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname), once = null;
    try { once = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); } catch (e) { /* storage blocked */ }
    if (!once && window.name.indexOf(KEY + ':') === 0) once = window.name.slice(KEY.length + 1);
    if (window.name.indexOf(KEY + ':') === 0) window.name = '';
    if (once) LEVEL = once; else if (dev && q) LEVEL = q;
    if (!/^[1-6]$/.test(LEVEL)) LEVEL = '1';
    if (q && !dev) history.replaceState(null, '', location.pathname);
    document.querySelectorAll('#levels button').forEach(function (b) {
      if (b.dataset.lv === LEVEL) b.classList.add('cur');
      b.addEventListener('click', function () {
        if (b.dataset.lv === LEVEL) return;
        try { sessionStorage.setItem(KEY, b.dataset.lv); } catch (e) { window.name = KEY + ':' + b.dataset.lv; }
        if (location.search) history.replaceState(null, '', location.pathname);
        location.reload();
      });
    });
  })();
</script>
<script type="text/plain" id="m-textures">
// Procedural textures + noise helpers. Everything in the game is generated here – no image files.
import * as THREE from 'three';

export const sm = (a, b, x) => { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
export const lerp = (a, b, t) => a + (b - a) * t;
export const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

export function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

export function hash(ix, iy, s = 0) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul((s | 0) + 1, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

export function vnoise(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

export function fbm(x, y, oct = 4, s = 0) {
  let a = 0.5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, y * f, s + i * 17); norm += a; a *= 0.5; f *= 2.03; }
  return sum / norm;
}

// ---- tileable noise (for textures) ----
function tnoise(x, y, px, py, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = ((ix % px) + px) % px, x1 = (x0 + 1) % px;
  const y0 = ((iy % py) + py) % py, y1 = (y0 + 1) % py;
  const a = hash(x0, y0, s), b = hash(x1, y0, s), c = hash(x0, y1, s), d = hash(x1, y1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tfbm(u, v, fx, fy, oct, s) {
  let a = 0.5, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * tnoise(u * fx, v * fy, fx, fy, s + i * 31); norm += a; a *= 0.5; fx *= 2; fy *= 2; }
  return sum / norm;
}

function finish(t, srgb, aniso = 8) {
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = aniso;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

function normalFromHeight(h, w, hh, strength) {
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(w, hh); const d = img.data;
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) {
    const xl = (x + w - 1) % w, xr = (x + 1) % w, yu = (y + hh - 1) % hh, yd = (y + 1) % hh;
    const dx = (h[y * w + xr] - h[y * w + xl]) * strength;
    const dy = (h[yd * w + x] - h[yu * w + x]) * strength;
    const l = 1 / Math.sqrt(dx * dx + dy * dy + 1);
    const i = (y * w + x) * 4;
    d[i] = (-dx * l * 0.5 + 0.5) * 255; d[i + 1] = (dy * l * 0.5 + 0.5) * 255; d[i + 2] = (l * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return finish(new THREE.CanvasTexture(c), false);
}

// fn(u, v, out) -> out = [r,g,b,height] in display (sRGB) space
function build(size, fn, normalStrength = 3) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size); const d = img.data;
  const h = new Float32Array(size * size); const o = [0, 0, 0, 0];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    fn(x / size, y / size, o);
    const i = y * size + x;
    d[i * 4] = o[0] * 255; d[i * 4 + 1] = o[1] * 255; d[i * 4 + 2] = o[2] * 255; d[i * 4 + 3] = 255;
    h[i] = o[3];
  }
  ctx.putImageData(img, 0, 0);
  return { map: finish(new THREE.CanvasTexture(c), true), normalMap: normalFromHeight(h, size, size, normalStrength * size / 512) };
}

// canvas with transparency -> DataTexture whose transparent texels keep a foliage colour (no dark fringes in mips)
function alphaTex(c, fill) {
  const ctx = c.getContext('2d'); const img = ctx.getImageData(0, 0, c.width, c.height); const p = img.data;
  for (let i = 0; i < p.length; i += 4) if (p[i + 3] < 8) { p[i] = fill[0]; p[i + 1] = fill[1]; p[i + 2] = fill[2]; p[i + 3] = 0; }
  const t = new THREE.DataTexture(new Uint8Array(p.buffer.slice(0)), c.width, c.height, THREE.RGBAFormat);
  return finish(t, true, 4);
}

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function leaf(ctx, x, y, len, wid, ang, col, rib) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.45, -wid, len, 0); ctx.quadraticCurveTo(len * 0.45, wid, 0, 0);
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = rib; ctx.lineWidth = Math.max(1, wid * 0.08); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.94, 0); ctx.stroke();
  ctx.restore();
}

function paw(ctx, x, y, s, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y + s * 0.25, s * 0.52, s * 0.42, 0, 0, 7); ctx.fill();
  const toes = [[-0.55, -0.28, -0.35], [-0.2, -0.62, -0.1], [0.2, -0.62, 0.1], [0.55, -0.28, 0.35]];
  for (const [tx, ty, r] of toes) { ctx.beginPath(); ctx.ellipse(x + tx * s, y + ty * s, s * 0.17, s * 0.24, r, 0, 7); ctx.fill(); }
}
function boneShape(ctx, x, y, len, th, col, ang = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col;
  ctx.fillRect(-len / 2, -th / 2, len, th);
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * len / 2, sy * th * 0.62, th * 0.78, 0, 7); ctx.fill(); }
  ctx.restore();
}
function fret(ctx, x, y, s, col) {
  ctx.strokeStyle = col; ctx.lineWidth = s * 0.14; ctx.lineJoin = 'miter';
  ctx.beginPath();
  ctx.moveTo(x, y + s); ctx.lineTo(x, y); ctx.lineTo(x + s, y); ctx.lineTo(x + s, y + s * 0.75);
  ctx.lineTo(x + s * 0.3, y + s * 0.75); ctx.lineTo(x + s * 0.3, y + s * 0.35); ctx.lineTo(x + s * 0.7, y + s * 0.35);
  ctx.stroke();
}

// carved stone: draw() paints a grey height image (128 = surface, darker = groove, lighter = raised)
function carve(w, h, draw, strength, seed) {
  const c = mkCanvas(w, h); const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h); draw(ctx);
  const b = mkCanvas(w, h); const bctx = b.getContext('2d'); bctx.filter = 'blur(1.6px)'; bctx.drawImage(c, 0, 0);
  const src = bctx.getImageData(0, 0, w, h).data;
  const hgt = new Float32Array(w * h);
  const out = mkCanvas(w, h); const octx = out.getContext('2d'); const img = octx.createImageData(w, h); const d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; const u = x / w, v = y / h;
    const hv = src[i * 4] / 255;
    const n = tfbm(u, v, 5, Math.max(2, Math.round(5 * h / w)), 5, seed), fine = tfbm(u, v, 48, Math.round(48 * h / w), 2, seed + 1);
    const groove = sm(0.47, 0.22, hv), raised = sm(0.52, 0.8, hv);
    let k = (0.62 + 0.5 * n) * (0.8 + 0.4 * fine) * (1 - groove * 0.5) * (1 + raised * 0.14);
    let r = 0.56 * k, g = 0.52 * k, bl = 0.44 * k;
    const moss = (groove * 0.8 + 0.12) * sm(0.42, 0.66, tfbm(u, v, 4, Math.max(2, Math.round(4 * h / w)), 3, seed + 2));
    r = lerp(r, 0.2, moss * 0.75); g = lerp(g, 0.3, moss * 0.75); bl = lerp(bl, 0.1, moss * 0.75);
    d[i * 4] = r * 255; d[i * 4 + 1] = g * 255; d[i * 4 + 2] = bl * 255; d[i * 4 + 3] = 255;
    hgt[i] = hv + n * 0.07 + fine * 0.03;
  }
  octx.putImageData(img, 0, 0);
  const map = finish(new THREE.CanvasTexture(out), true); const normalMap = normalFromHeight(hgt, w, h, strength);
  return { map, normalMap };
}

export function createTextures() {
  const T = {};

  T.rock = build(512, (u, v, o) => {
    const n = tfbm(u, v, 4, 4, 6, 1);
    const r = 1 - Math.abs(tfbm(u, v, 6, 6, 5, 2) * 2 - 1);
    const c = Math.abs(tfbm(u, v, 5, 5, 4, 3) - 0.5);
    const crack = 1 - sm(0.0, 0.035, c);
    const fine = tfbm(u, v, 48, 48, 3, 4);
    const warm = tfbm(u, v, 3, 3, 3, 5);
    let R = lerp(0.3, 0.6, n) + (warm - 0.5) * 0.12, G = lerp(0.28, 0.54, n), B = lerp(0.25, 0.46, n) - (warm - 0.5) * 0.08;
    const sh = (0.72 + 0.56 * fine) * (1 - crack * 0.3) * (0.8 + 0.3 * r);
    o[0] = R * sh; o[1] = G * sh; o[2] = B * sh; o[3] = n * 0.5 + r * 0.32 + fine * 0.18 - crack * 0.22;
  }, 4.5);

  T.ground = build(512, (u, v, o) => {
    const n = tfbm(u, v, 5, 5, 5, 11), f = tfbm(u, v, 40, 40, 3, 12), m = tfbm(u, v, 7, 7, 4, 13);
    const moss = sm(0.44, 0.62, m), k = 0.55 + 0.9 * f;
    let R = lerp(0.27, 0.2, moss) * k, G = lerp(0.19, 0.31, moss) * k, B = lerp(0.11, 0.08, moss) * k;
    const sp = tnoise(u * 110, v * 110, 110, 110, 14);
    if (sp > 0.84) { const q = (sp - 0.84) * 6; R = lerp(R, 0.46, q); G = lerp(G, 0.33, q); B = lerp(B, 0.13, q); }
    o[0] = R; o[1] = G; o[2] = B; o[3] = n * 0.45 + f * 0.55;
  }, 3);

  T.moss = build(256, (u, v, o) => {
    const n = tfbm(u, v, 6, 6, 5, 21), f = tfbm(u, v, 36, 36, 3, 22);
    const k = 0.6 + 0.8 * f;
    o[0] = lerp(0.12, 0.34, n) * k; o[1] = lerp(0.23, 0.45, n) * k; o[2] = lerp(0.04, 0.1, n) * k; o[3] = n * 0.4 + f * 0.6;
  }, 3);

  T.blocks = build(512, (u, v, o) => {
    const ry = v * 8, row = Math.floor(ry), fy = ry - row;
    const rx = u * 4 + (row % 2) * 0.5, col = Math.floor(rx), fx = rx - col;
    const e = Math.min(Math.min(fx, 1 - fx) * 2, Math.min(fy, 1 - fy));
    const bevel = sm(0.0, 0.085, e);
    const id = hash(((col % 4) + 4) % 4, row, 31), id2 = hash(((col % 4) + 4) % 4, row, 37);
    const n = tfbm(u, v, 8, 8, 5, 32), fine = tfbm(u, v, 64, 64, 2, 33), mn = tfbm(u, v, 5, 5, 3, 34);
    const streak = tfbm(u, v, 24, 3, 3, 35);
    let k = (0.8 + 0.3 * id) * (0.68 + 0.5 * n) * (0.5 + 0.5 * bevel) * (0.85 + 0.3 * fine) * (0.82 + 0.3 * streak);
    let R = lerp(0.56, 0.47, id2) * k, G = lerp(0.52, 0.45, id2) * k, B = lerp(0.43, 0.41, id2) * k;
    const moss = clamp((1 - bevel) * sm(0.38, 0.6, mn) + sm(0.6, 0.76, n) * 0.7, 0, 1) * 0.85;
    R = lerp(R, 0.19 * (0.6 + 0.8 * fine), moss); G = lerp(G, 0.3 * (0.6 + 0.8 * fine), moss); B = lerp(B, 0.08, moss);
    o[0] = R; o[1] = G; o[2] = B; o[3] = bevel * 0.75 + n * 0.17 + fine * 0.08;
  }, 5);

  T.wood = build(256, (u, v, o) => {
    const g = tfbm(u, v, 3, 40, 4, 41), f = tfbm(u, v, 30, 90, 2, 42), w = tfbm(u, v, 3, 3, 3, 43);
    const dark = sm(0.56, 0.7, tfbm(u, v, 2, 26, 3, 44));
    let R = lerp(0.24, 0.5, g), G = lerp(0.16, 0.37, g), B = lerp(0.09, 0.22, g);
    R = lerp(R, 0.42, w * 0.5); G = lerp(G, 0.4, w * 0.5); B = lerp(B, 0.36, w * 0.5);
    const k = (0.75 + 0.5 * f) * (1 - dark * 0.45);
    o[0] = R * k; o[1] = G * k; o[2] = B * k; o[3] = g * 0.7 + f * 0.3 - dark * 0.4;
  }, 4);

  T.bark = build(256, (u, v, o) => {
    const g = tfbm(u, v, 10, 3, 4, 51), f = tfbm(u, v, 40, 20, 2, 52), m = tfbm(u, v, 4, 4, 3, 53);
    const crack = sm(0.42, 0.3, g);
    let k = (0.6 + 0.7 * f) * (1 - crack * 0.55);
    let R = 0.3 * k, G = 0.24 * k, B = 0.17 * k;
    const moss = sm(0.5, 0.68, m) * 0.7;
    R = lerp(R, 0.17, moss); G = lerp(G, 0.28, moss); B = lerp(B, 0.07, moss);
    o[0] = R; o[1] = G; o[2] = B; o[3] = g * 0.8 + f * 0.2;
  }, 5);

  // linear noise lookup (3 independent fbm channels)
  {
    const s = 256; const data = new Uint8Array(s * s * 4);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const u = x / s, v = y / s, i = (y * s + x) * 4;
      data[i] = sm(0.15, 0.85, tfbm(u, v, 4, 4, 6, 61)) * 255;
      data[i + 1] = sm(0.15, 0.85, tfbm(u, v, 5, 5, 6, 62)) * 255;
      data[i + 2] = sm(0.15, 0.85, tfbm(u, v, 8, 8, 5, 63)) * 255;
      data[i + 3] = 255;
    }
    T.noise = finish(new THREE.DataTexture(data, s, s, THREE.RGBAFormat), false, 4);
  }

  // water normals
  {
    const s = 256; const h = new Float32Array(s * s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const u = x / s, v = y / s;
      h[y * s + x] = tfbm(u, v, 5, 5, 5, 71) + 0.5 * (1 - Math.abs(tfbm(u, v, 9, 9, 3, 72) * 2 - 1));
    }
    T.waterN = normalFromHeight(h, s, s, 7);
  }

  // ---- foliage (alpha) ----
  {
    const c = mkCanvas(256, 256), ctx = c.getContext('2d'), R = rng(7);
    for (let i = 0; i < 70; i++) {
      const a = R() * 6.283, d = Math.sqrt(R()) * 84;
      const x = 128 + Math.cos(a) * d, y = 128 + Math.sin(a) * d;
      const li = 14 + i * 0.36 + R() * 8, hue = 78 + R() * 44, sat = 42 + R() * 24;
      leaf(ctx, x - Math.cos(a) * 12, y - Math.sin(a) * 12, 34 + R() * 26, 9 + R() * 8, a + (R() - 0.5) * 1.4,
        `hsl(${hue},${sat}%,${li}%)`, `hsl(${hue},${sat}%,${li + 9}%)`);
    }
    T.leaves = alphaTex(c, [52, 92, 30]);
  }
  {
    // atlas: left = fern clump, right = broad-leaf plant
    const c = mkCanvas(512, 256), ctx = c.getContext('2d'), R = rng(9);
    for (let b = 0; b < 13; b++) {
      const ang = -1.2 + (b / 12) * 2.4 + (R() - 0.5) * 0.2, len = 150 + R() * 85;
      const hue = 85 + R() * 30, li = 20 + R() * 16;
      const bx = 128, by = 254;
      const ex = bx + Math.sin(ang) * len, ey = by - Math.cos(ang) * len * (0.75 + 0.25 * Math.cos(ang));
      const mx = bx + Math.sin(ang) * len * 0.45, my = by - Math.cos(ang) * len * 0.75;
      ctx.strokeStyle = `hsl(${hue},45%,${li - 6}%)`; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
      for (let k = 1; k <= 20; k++) {
        const t = k / 21, it = 1 - t;
        const px = it * it * bx + 2 * it * t * mx + t * t * ex, py = it * it * by + 2 * it * t * my + t * t * ey;
        const tx = 2 * it * (mx - bx) + 2 * t * (ex - mx), ty = 2 * it * (my - by) + 2 * t * (ey - my);
        const ta = Math.atan2(ty, tx), ll = 25 * Math.sin(Math.PI * Math.min(1, t * 1.15 + 0.08)) + 3;
        for (const sgn of [-1, 1]) leaf(ctx, px, py, ll, ll * 0.2, ta + sgn * 1.05, `hsl(${hue + R() * 8},${50 + R() * 12}%,${li + R() * 8}%)`, `hsl(${hue},40%,${li + 12}%)`);
      }
    }
    for (let b = 0; b < 8; b++) {
      const ang = -1.25 + (b / 7) * 2.5 + (R() - 0.5) * 0.25, len = 150 + R() * 80;
      const hue = 95 + R() * 28, li = 20 + R() * 14;
      leaf(ctx, 384, 254, len, 26 + R() * 16, ang - Math.PI / 2, `hsl(${hue},52%,${li}%)`, `hsl(${hue},45%,${li + 12}%)`);
    }
    T.plants = alphaTex(c, [44, 88, 28]);
  }
  {
    const c = mkCanvas(256, 96), ctx = c.getContext('2d'), R = rng(11);
    for (let x = 4; x < 250; x += 4) {
      const t = x / 256, ll = 44 * Math.sin(Math.PI * Math.min(1, t * 0.9 + 0.12)) * (0.85 + R() * 0.3);
      for (const sgn of [-1, 1]) leaf(ctx, x, 48, ll, 3.4, sgn * (1.05 - t * 0.35) , `hsl(${92 + R() * 20},48%,${19 + R() * 12}%)`, 'hsl(95,40%,34%)');
    }
    ctx.strokeStyle = 'hsl(80,35%,30%)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 48); ctx.lineTo(252, 48); ctx.stroke();
    T.frond = alphaTex(c, [40, 84, 30]);
    T.frond.wrapS = T.frond.wrapT = THREE.ClampToEdgeWrapping;
  }
  {
    const c = mkCanvas(64, 256), ctx = c.getContext('2d'), R = rng(13);
    const sx = (y) => 32 + 9 * Math.sin((y / 128) * 6.283) + 4 * Math.sin((y / 64) * 6.283 + 1);
    ctx.strokeStyle = 'hsl(70,30%,20%)'; ctx.lineWidth = 2.6; ctx.beginPath();
    for (let y = 0; y <= 256; y += 4) { if (y === 0) ctx.moveTo(sx(y), y); else ctx.lineTo(sx(y), y); } ctx.stroke();
    for (let y = 6; y < 256; y += 11) {

      leaf(ctx, sx(y), y, 15 + R() * 8, 6 + R() * 3, Math.PI / 2 - sgn * (1.0 + R() * 0.4), `hsl(${88 + R() * 30},50%,${20 + R() * 15}%)`, 'hsl(95,40%,36%)');
    }
    T.vine = alphaTex(c, [42, 86, 28]);
  }

  // ---- dalmatian coat (liver / chocolate spots, modelled on the real Łatka) ----
  {
    const coat = (seed, n, rMin, rMax, big) => {
      const c = mkCanvas(256, 256), ctx = c.getContext('2d'), R = rng(seed);
      ctx.fillStyle = '#f4f1eb'; ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 300; i++) { ctx.fillStyle = `rgba(${205 + R() * 30},${198 + R() * 30},${188 + R() * 30},0.1)`; ctx.beginPath(); ctx.arc(R() * 256, R() * 256, 4 + R() * 14, 0, 7); ctx.fill(); }

        if (!ok) continue; placed.push([x, y, r]); i++;
        const l = 11 + R() * 7; ctx.fillStyle = `hsl(${18 + R() * 8},${42 + R() * 12}%,${l}%)`;
        const a = R() * 3.14, el = 0.72 + R() * 0.3, lobes = R() < 0.35 ? 2 : 1;
        for (let k = 0; k < lobes; k++) { const ox = k ? (R() - 0.5) * r * 1.1 : 0, oy = k ? (R() - 0.5) * r * 1.1 : 0, rr = k ? r * 0.7 : r;
          for (const wx of [-256, 0, 256]) for (const wy of [-256, 0, 256]) { ctx.beginPath(); ctx.ellipse(x + ox + wx, y + oy + wy, rr, rr * el, a, 0, 7); ctx.fill(); } }

    T.spots = coat(21, 150, 3.2, 9.5, 0.12);      // body: dense, mixed sizes

  T.door = carve(512, 1024, (ctx) => {

    // medallion with paw
    ctx.strokeStyle = G; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(256, 480, 168, 0, 7); ctx.stroke();
    ctx.fillStyle = '#9c9c9c'; ctx.beginPath(); ctx.arc(256, 480, 150, 0, 7); ctx.fill();
    ctx.strokeStyle = G; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(256, 480, 128, 0, 7); ctx.stroke();

  T.glyphDiaper = glyph((ctx) => { ctx.beginPath(); ctx.moveTo(22, 36); ctx.lineTo(106, 36); ctx.lineTo(102, 60); ctx.quadraticCurveTo(84, 66, 78, 96); ctx.lineTo(50, 96); ctx.quadraticCurveTo(44, 66, 26, 60); ctx.closePath(); ctx.fill(); });
  T.glyphBall = glyph((ctx) => { ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(64, 64, 40, 0, 7); ctx.stroke(); ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 0.4; ctx.lineTo(64 + Math.cos(a) * 16, 64 + Math.sin(a) * 16); } ctx.closePath(); ctx.fill(); ctx.lineWidth = 6; ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 0.4; ctx.moveTo(64 + Math.cos(a) * 16, 64 + Math.sin(a) * 16); ctx.lineTo(64 + Math.cos(a) * 38, 64 + Math.sin(a) * 38); } ctx.stroke(); });
  T.glyphMirror = glyph((ctx) => { ctx.beginPath(); ctx.arc(64, 48, 28, 0, 7); ctx.fill(); ctx.fillRect(58, 72, 12, 40); });

// Small building kit shared by the newer levels: vertex-coloured shapes merged into one mesh, a gable roof, canvas textures.
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { rng } from './textures.js';

export const worldMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.93, side: THREE.DoubleSide });

export class Builder {
  constructor(seed) { this.g = []; this.r = rng(seed); }
  add(geo, color, x = 0, y = 0, z = 0, ry = 0, jit = 0.07) {
    const g = geo.index ? geo.toNonIndexed() : geo; g.deleteAttribute('uv');
    if (ry) g.rotateY(ry); g.translate(x, y, z);
    const n = g.attributes.position.count, c = new Float32Array(n * 3), col = new THREE.Color(color), k = 1 + (this.r() - 0.5) * 2 * jit;
    for (let i = 0; i < n; i++) { c[i * 3] = col.r * k; c[i * 3 + 1] = col.g * k; c[i * 3 + 2] = col.b * k; }
    g.setAttribute('color', new THREE.BufferAttribute(c, 3)); this.g.push(g); return g;
  }
  box(w, h, d, x, y, z, color, ry = 0, jit) { return this.add(new THREE.BoxGeometry(w, h, d), color, x, y + h / 2, z, ry, jit); }   // y is the base
  cyl(rt, rb, h, x, y, z, color, seg = 8) { return this.add(new THREE.CylinderGeometry(rt, rb, h, seg), color, x, y + h / 2, z); }
  cone(r, h, x, y, z, color, seg = 7) { return this.add(new THREE.ConeGeometry(r, h, seg), color, x, y + h / 2, z, this.r() * 3); }
  blob(r, x, y, z, color, sy = 1, sx = 1, sz = 1) { const g = new THREE.IcosahedronGeometry(r, 1); g.scale(sx, sy, sz); return this.add(g, color, x, y, z, this.r() * 3, 0.12); }
  get empty() { return this.g.length === 0; }
  mesh(mat = worldMat) { const m = new THREE.Mesh(mergeGeometries(this.g), mat); m.castShadow = true; m.receiveShadow = true; this.g = []; return m; }
}

export function roofGeo(w, h, d) {       // gable prism, ridge along z
  const a = w / 2, b = d / 2, p = [-a, 0, -b, 0, h, -b, 0, h, b, -a, 0, -b, 0, h, b, -a, 0, b, a, 0, -b, a, 0, b, 0, h, b, a, 0, -b, 0, h, b, 0, h, -b, -a, 0, -b, a, 0, -b, 0, h, -b, -a, 0, b, 0, h, b, a, 0, b];
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.computeVertexNormals();
  g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(p.length / 3 * 2), 2)); return g;
}

export function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t;
}

// Billboard particles + additive light beams.
import * as THREE from 'three';

export const fogUniforms = { uFogColor: { value: new THREE.Color(0.7, 0.6, 0.5) }, uFogDensity: { value: 0.004 } };

export class Particles {
  constructor(max, additive) {
    this.max = max; this.n = 0;
    this.p = new Float32Array(max * 3); this.d = new Float32Array(max * 2); this.c = new Float32Array(max * 4);
    this.v = new Float32Array(max * 3); this.life = new Float32Array(max); this.age = new Float32Array(max);
    this.s0 = new Float32Array(max); this.s1 = new Float32Array(max); this.a0 = new Float32Array(max);
    this.grav = new Float32Array(max); this.drag = new Float32Array(max); this.rv = new Float32Array(max);
    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.5, -0.5, 0, 0.5, -0.5, 0, 0.5, 0.5, 0, -0.5, 0.5, 0]), 3));
    g.setIndex([0, 1, 2, 0, 2, 3]);
    this.aP = new THREE.InstancedBufferAttribute(this.p, 3); this.aD = new THREE.InstancedBufferAttribute(this.d, 2); this.aC = new THREE.InstancedBufferAttribute(this.c, 4);
    for (const a of [this.aP, this.aD, this.aC]) a.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('iPos', this.aP); g.setAttribute('iData', this.aD); g.setAttribute('iCol', this.aC);
    g.instanceCount = 0;
    const mat = new THREE.ShaderMaterial({
      uniforms: fogUniforms,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      vertexShader: `
        attribute vec3 iPos; attribute vec2 iData; attribute vec4 iCol;
        uniform float uFogDensity; varying vec2 vUv; varying vec4 vCol; varying float vFog;
        void main(){ vUv = position.xy; vCol = iCol;
          vec4 mv = viewMatrix * vec4(iPos, 1.0);
          float c = cos(iData.y), s = sin(iData.y);
          mv.xy += mat2(c, -s, s, c) * position.xy * iData.x;
          gl_Position = projectionMatrix * mv;
          float d = -mv.z; vFog = 1.0 - exp(-uFogDensity * uFogDensity * d * d);
          vCol.a *= smoothstep(0.15, 0.7, d); }`,
      fragmentShader: `
        uniform vec3 uFogColor; varying vec2 vUv; varying vec4 vCol; varying float vFog;
        void main(){ float d = length(vUv) * 2.0; float a = smoothstep(1.0, 0.0, d); a *= a;
          ${additive ? 'gl_FragColor = vec4(vCol.rgb * (1.0 - vFog), vCol.a * a);' : 'gl_FragColor = vec4(mix(vCol.rgb, uFogColor, vFog), vCol.a * a);'} }`,
    });
    this.geo = g;
    this.mesh = new THREE.Mesh(g, mat); this.mesh.frustumCulled = false; this.mesh.renderOrder = additive ? 11 : 10;
  }
  spawn(x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a, grav = 0, drag = 0) {
    if (this.n >= this.max) return;
    const i = this.n++;
    this.p[i * 3] = x; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z;
    this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = vz;
    this.life[i] = life; this.age[i] = 0; this.s0[i] = s0; this.s1[i] = s1; this.a0[i] = a;
    this.c[i * 4] = r; this.c[i * 4 + 1] = g; this.c[i * 4 + 2] = b; this.c[i * 4 + 3] = 0;
    this.grav[i] = grav; this.drag[i] = drag; this.d[i * 2] = s0; this.d[i * 2 + 1] = Math.random() * 6.283; this.rv[i] = (Math.random() - 0.5) * 1.2;
  }
  update(dt) {
    const { p, v, c, d } = this;
    for (let i = 0; i < this.n; i++) {
      this.age[i] += dt;
      if (this.age[i] >= this.life[i]) {
        const j = --this.n;
        if (i !== j) {
          p.copyWithin(i * 3, j * 3, j * 3 + 3); v.copyWithin(i * 3, j * 3, j * 3 + 3); c.copyWithin(i * 4, j * 4, j * 4 + 4); d.copyWithin(i * 2, j * 2, j * 2 + 2);
          for (const arr of [this.life, this.age, this.s0, this.s1, this.a0, this.grav, this.drag, this.rv]) arr[i] = arr[j];
        }
        i--; continue;
      }
      const t = this.age[i] / this.life[i];
      const dr = Math.max(0, 1 - this.drag[i] * dt);
      v[i * 3] *= dr; v[i * 3 + 1] = v[i * 3 + 1] * dr - this.grav[i] * dt; v[i * 3 + 2] *= dr;
      p[i * 3] += v[i * 3] * dt; p[i * 3 + 1] += v[i * 3 + 1] * dt; p[i * 3 + 2] += v[i * 3 + 2] * dt;
      d[i * 2] = this.s0[i] + (this.s1[i] - this.s0[i]) * t; d[i * 2 + 1] += this.rv[i] * dt;
      c[i * 4 + 3] = this.a0[i] * Math.min(1, t * 7) * (1 - t) * (1 - t * 0.3);
    }
    this.geo.instanceCount = this.n;
    this.aP.needsUpdate = this.aD.needsUpdate = this.aC.needsUpdate = true;
  }
}

// soft additive column of light (v = 0 at the bottom)
export function beamMaterial(color, strength, timeU) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: strength }, uTime: timeU },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uStrength; uniform float uTime; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ float f = pow(abs(dot(normalize(vN), normalize(vV))), 2.0);
        float a = pow(clamp(1.0 - vUv.y, 0.0, 1.0), 1.6) * f * (0.8 + 0.2 * sin(vUv.y * 40.0 - uTime * 3.0 + vUv.x * 12.0));
        gl_FragColor = vec4(uColor * uStrength, a); }`,
  });
}

// soft round glow sprite
export function glowMaterial(color, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: strength } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 uColor; uniform float uStrength; varying vec2 vUv; void main(){ float d = length(vUv - 0.5) * 2.0; float a = smoothstep(1.0, 0.0, d); gl_FragColor = vec4(uColor * uStrength, a * a); }',
  });
}

// Łatka the Dalmatian (also used for the puppies and the stone statues).
import * as THREE from 'three';
import { clamp, lerp, sm } from './textures.js';

const Y = new THREE.Vector3(0, 1, 0);
const V = (x, y, z) => new THREE.Vector3(x, y, z);

export function buildDog(tex, opt = {}) {
  const P = Object.assign({ scale: 1, head: 1, leg: 1, ear: 1, snout: 1, lantern: false, stone: null, seed: 1 }, opt);
  const st = P.stone;
  const fur = st || new THREE.MeshStandardMaterial({ map: tex.spots, roughness: 0.78 });
  const white = st || new THREE.MeshStandardMaterial({ color: 0xf1eee8, roughness: 0.8 });
  const fine = st || new THREE.MeshStandardMaterial({ map: tex.spotsFine, roughness: 0.78 });
  const blk = st || new THREE.MeshStandardMaterial({ color: 0x4a2c1b, roughness: 0.7 });          // liver-brown ears and eye patches
  const eyeM = st || new THREE.MeshStandardMaterial({ color: 0xa8742a, roughness: 0.08 });         // amber eyes
  const pupilM = st || new THREE.MeshStandardMaterial({ color: 0x0a0605, roughness: 0.05 });
  const noseM = st || new THREE.MeshStandardMaterial({ color: 0x8d5b4c, roughness: 0.38 });        // liver-pink nose
  const lipM = st || new THREE.MeshStandardMaterial({ color: 0x3a2318, roughness: 0.6 });
  const tongueM = st || new THREE.MeshStandardMaterial({ color: 0xe8788a, roughness: 0.45 });
  const collarM = st || new THREE.MeshStandardMaterial({ color: 0xb3261e, roughness: 0.55 });
  const brass = st || new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.3, metalness: 1 });

  const all = [];
  const mesh = (g, m) => { const o = new THREE.Mesh(g, m); o.castShadow = true; o.receiveShadow = true; all.push(o); return o; };
  const uvOff = (g) => { const uv = g.attributes.uv; const ou = Math.random(), ov = Math.random(); for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 0.9 + ou, uv.getY(i) * 0.9 + ov); return g; };
  const limb = (a, b, ra, rb, m) => {
    const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
    const o = mesh(uvOff(new THREE.CylinderGeometry(rb, ra, len, 12, 1)), m);
    o.position.copy(a).addScaledVector(d, 0.5); o.quaternion.setFromUnitVectors(Y, d.normalize()); return o;
  };
  const ball = (r, m, x, y, z, sx = 1, sy = 1, sz = 1) => { const o = mesh(uvOff(new THREE.SphereGeometry(r, 16, 12)), m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); return o; };

  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const baseY = 0.4 * P.leg + 0.07;
  body.position.y = baseY;

  // torso
  const prof = [[0, -0.37], [0.06, -0.36], [0.108, -0.31], [0.122, -0.2], [0.118, -0.06], [0.135, 0.08], [0.158, 0.2], [0.15, 0.29], [0.11, 0.35], [0.05, 0.385], [0, 0.39]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const tg = new THREE.LatheGeometry(prof, 20); tg.rotateX(Math.PI / 2); tg.scale(0.84, 1, 1);
  { const p = tg.attributes.position; for (let i = 0; i < p.count; i++) { const z = p.getZ(i); let y = p.getY(i); if (y < 0) y *= 1 + 0.2 * sm(-0.05, 0.25, z) - 0.14 * sm(0.02, -0.2, z); p.setY(i, y - 0.035 * Math.max(0, z) / 0.3 + 0.015); } tg.computeVertexNormals(); }
  { const uv = tg.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 2, uv.getY(i) * 1.6); } // denser, smaller body spots like the real Łatka
  const torso = mesh(tg, fur); body.add(torso);

  // legs
  const legs = [];
  const mkLeg = (x, y, z, hind) => {
    const lu = 0.2 * P.leg, ll = 0.2 * P.leg;
    const hip = new THREE.Group(); hip.position.set(x, y, z);
    hip.add(limb(V(0, 0.02, 0), V(0, -lu, 0), hind ? 0.064 : 0.05, 0.037, fur)); hip.add(ball(hind ? 0.068 : 0.052, fur, 0, 0.02, 0));
    const knee = new THREE.Group(); knee.position.y = -lu; hip.add(knee);
    knee.add(ball(0.038, fur, 0, 0, 0)); knee.add(limb(V(0, 0, 0), V(0, -ll, 0), 0.035, 0.027, fine));
    knee.add(ball(0.041, fine, 0, -ll + 0.006, 0.02, 1, 0.62, 1.4));
    if (P.scale >= 1) for (const tx of [-0.02, 0, 0.02]) knee.add(ball(0.015, fine, tx, -ll - 0.002, 0.066 - Math.abs(tx) * 0.4, 1, 0.8, 1.3));   // toes
    body.add(hip);
    const L = { hip, knee, hind, rest: hind ? -0.35 : 0.04, restK: hind ? 0.7 : 0.0 };
    legs.push(L); return L;
  };
  mkLeg(-0.088, -0.05, 0.22, false); mkLeg(0.088, -0.05, 0.22, false);
  mkLeg(-0.09, -0.074, -0.25, true); mkLeg(0.09, -0.074, -0.25, true);

  // neck + head
  const headPos = V(0, 0.235, 0.43);
  body.add(limb(V(0, 0.03, 0.26), headPos, 0.105, 0.075, fur));
  body.add(ball(0.118, fur, 0, -0.035, 0.265, 0.9, 1.05, 0.9));   // forechest
  const head = new THREE.Group(); head.position.copy(headPos); head.scale.setScalar(P.head); body.add(head);
  // sculpted head: one mesh for skull, stop, muzzle and flews; the eye patches are painted with vertex colours
  const SN = P.snout, tipZ = 0.06 + 0.154 * SN;
  const hg = new THREE.LatheGeometry([[0, -0.108], [0.045, -0.104], [0.08, -0.082], [0.098, -0.04], [0.102, 0.0], [0.098, 0.035], [0.086, 0.06], [0.07, 0.078], [0.06, 0.095], [0.056, 0.125], [0.053, 0.16], [0.049, 0.188], [0.04, 0.205], [0.022, 0.213], [0, 0.215]].map(([r, y]) => new THREE.Vector2(r, y)), 28);
  hg.rotateX(Math.PI / 2);
  {
    const hp = hg.attributes.position, col = new Float32Array(hp.count * 3), cB = new THREE.Color(0x4a2c1b), cL = new THREE.Color(0x2b1a12), cc = new THREE.Color();
    for (let i = 0; i < hp.count; i++) {
      let x = hp.getX(i), y = hp.getY(i), z = hp.getZ(i);
      const mz = sm(0.055, 0.11, z);                                   // 0 on the skull, 1 on the muzzle
      x *= lerp(0.93, 0.88, mz);
      y *= y > 0 ? lerp(0.9, 0.7, mz) : lerp(0.92, 1.1, mz);           // flat nose bridge, deeper lips
      y -= 0.021 * mz;                                                  // muzzle sits below the crown (the "stop")
      if (y > 0) { const bx = Math.abs(x) - 0.044; y += 0.013 * Math.exp(-(bx * bx) / 0.0006 - ((z - 0.06) ** 2) / 0.0005); }   // brow ridges
      if (y < 0.02) x *= 1 + 0.07 * Math.exp(-((z - 0.03) ** 2) / 0.002);                                                    // cheeks
      if (y < -0.012) x *= 1 + 0.13 * mz * sm(0.21, 0.13, z);                                                                // hanging flews
      if (y > 0.02 && Math.abs(x) < 0.02) y -= 0.004 * sm(0.03, 0.09, z) * sm(0.02, 0, Math.abs(x)) * (1 - mz);              // furrow between the eyes
      const n = Math.sin(x * 190 + z * 140) * 0.006 + Math.sin(y * 230 + z * 90) * 0.005;
      let k = 1 - sm(0.05, 0.062, Math.hypot(Math.abs(x) - 0.054, (y - 0.036) * 0.85, (z - 0.045) * 0.7) + n);
      k = Math.max(k, 1 - sm(0.046, 0.058, Math.hypot(Math.abs(x) - 0.08, y - 0.05, (z + 0.02) * 0.6) + n));
      k *= sm(0.01, 0.022, Math.abs(x));                                // white blaze down the middle
      cc.setRGB(1, 1, 1).lerp(cB, k).lerp(cL, mz * sm(-0.06, -0.072, y) * 0.9);
      if (z > 0.06) z = 0.06 + (z - 0.06) * SN;
      hp.setXYZ(i, x, y, z); col[i * 3] = cc.r; col[i * 3 + 1] = cc.g; col[i * 3 + 2] = cc.b;
    }
    hg.setAttribute('color', new THREE.BufferAttribute(col, 3)); hg.computeVertexNormals();
    const uv = hg.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 0.9 + 0.3, uv.getY(i) * 0.75);
  }
  const headM = st || new THREE.MeshStandardMaterial({ map: tex.spotsFine, vertexColors: true, roughness: 0.78 });
  head.add(mesh(hg, headM));
  // nose leather with nostrils
  head.add(ball(0.027, noseM, 0, -0.013, tipZ - 0.004, 1.25, 0.95, 0.85));
  for (const s of [-1, 1]) head.add(ball(0.0075, lipM, s * 0.012, -0.016, tipZ + 0.0165, 1, 0.8, 0.6));
  head.add(ball(0.004, lipM, 0, -0.034, tipZ + 0.008, 0.6, 2.4, 0.8));           // philtrum
  head.add(ball(0.027, white, 0, -0.085, 0.06 + 0.066 * SN, 0.92, 0.5, 2.15 * SN)); // lower jaw
  const eyeZ = 0.06 + 0.014 * SN;
  for (const s of [-1, 1]) {
    head.add(ball(0.0155, eyeM, s * 0.046, 0.037, eyeZ + 0.001));
    head.add(ball(0.0085, pupilM, s * 0.0474, 0.0373, eyeZ + 0.0098));
    head.add(ball(0.0175, lipM, s * 0.046, 0.0375, eyeZ - 0.003, 1.08, 1.02, 1));   // dark eyelid rim
    if (!st) { const hl = ball(0.0045, new THREE.MeshBasicMaterial({ color: 0xffffff }), s * 0.0435, 0.0435, eyeZ + 0.0145); hl.castShadow = false; head.add(hl); }
  }
  // tongue lies inside the mouth, between the upper lip and the lower jaw, and only its tip lolls out over the front of the jaw
  const tongue = ball(0.022, tongueM, 0, -0.07, 0.06 + 0.118 * SN, 0.7, 0.26, 2.0); tongue.rotation.x = 0.42; head.add(tongue);
  // ears: soft triangles that taper to a rounded tip and hang against the cheeks
  const ears = [];
  const eg = new THREE.SphereGeometry(1, 14, 10);
  { const ep = eg.attributes.position; for (let i = 0; i < ep.count; i++) { const t = (1 - ep.getY(i)) / 2; ep.setX(i, ep.getX(i) * lerp(1.05, 0.5, t * t)); ep.setZ(i, ep.getZ(i) * lerp(1.3, 0.8, t)); } eg.scale(0.06 * P.ear, 0.098 * P.ear, 0.012); eg.computeVertexNormals(); }
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(s * 0.08, 0.062, -0.022);
    const e = mesh(eg, blk); e.position.set(s * 0.024, -0.08 * P.ear, 0.012); e.rotation.set(0.12, s * 0.5, s * 0.2);
    piv.add(e); head.add(piv); ears.push({ piv, s });
  }

  // tail
  const tail = []; let tp = new THREE.Group(); tp.position.set(0, 0.06, -0.35); body.add(tp);
  for (let i = 0; i < 5; i++) {
    const len = 0.085; tp.add(limb(V(0, 0, 0), V(0, len, 0), 0.027 - i * 0.0042, 0.023 - i * 0.0042, fine));
    tail.push(tp); const n = new THREE.Group(); n.position.y = len; tp.add(n); tp = n;
  }

  // collar + lantern
  let light = null, flame = null;
  if (!st) {
    const col = mesh(new THREE.TorusGeometry(0.094, 0.014, 8, 22), collarM); col.position.set(0, 0.105, 0.325); col.rotation.x = -0.72; body.add(col);
    if (P.lantern) {
      const lan = new THREE.Group(); lan.position.set(0, 0.0, 0.405); body.add(lan);
      lan.add(mesh(new THREE.CylinderGeometry(0.02, 0.026, 0.018, 10), brass));
      const cap = mesh(new THREE.ConeGeometry(0.03, 0.03, 10), brass); cap.position.y = -0.075; cap.rotation.x = Math.PI; lan.add(cap);
      flame = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.05, 0.3) }));
      flame.position.y = -0.04; lan.add(flame);
      light = new THREE.PointLight(0xffa24a, 0, 20, 2); light.position.set(0, 0.95, 0.45); lan.add(light);
    }
  }

  root.scale.setScalar(P.scale);

  const A = { phase: Math.random() * 6, t: Math.random() * 10, bark: 0, sit: 0, lookY: 0, slide: 0 };
  function animate(dt, s = {}) {
    A.t += dt;
    const sp = s.speed || 0, run = clamp((sp - 3.5) / 4, 0, 1), air = s.grounded === false;
    const happy = s.happy || 0;
    A.sit += ((s.sit || 0) - A.sit) * Math.min(1, dt * 6);
    const sit = A.sit;
    A.slide += ((s.slide || 0) - A.slide) * Math.min(1, dt * 16);                 // belly slide (level 2): legs stretched out, chest on the ground
    const sl = A.slide;
    if (sp > 0.2) A.phase += dt * (5.5 + sp * 1.75);
    const amp = air ? 0 : Math.min(1, sp / 2.2) * (0.5 + 0.4 * run);
    const offs = run > 0.5 ? [0, 0.7, Math.PI, Math.PI + 0.7] : [0, Math.PI, Math.PI, 0];
    legs.forEach((L, i) => {
      const ph = A.phase + offs[i];
      let h = L.rest - Math.sin(ph) * amp * 0.9, k = L.restK + Math.max(0, Math.cos(ph)) * amp * 1.15;
      if (air) { const up = (s.vy || 0) > 0; h = L.hind ? (up ? 0.75 : 0.2) : (up ? -0.95 : -0.5); k = L.hind ? 0.25 : 0.35; }
      if (sl > 0.01) { h = lerp(h, L.hind ? 1.25 : -1.35, sl); k = lerp(k, 0.1, sl); }
      if (sit > 0.01) { const hs = L.hind ? -0.55 : 1.02, ks = L.hind ? 2.5 : 0; h = lerp(h, hs, sit); k = lerp(k, ks, sit); }
      L.hip.rotation.x += (h - L.hip.rotation.x) * Math.min(1, dt * 22);
      L.knee.rotation.x += (k - L.knee.rotation.x) * Math.min(1, dt * 22);
    });
    body.position.y = baseY + Math.abs(Math.sin(A.phase)) * 0.022 * amp - sit * 0.19 - sl * 0.27 + Math.sin(A.t * 2.2) * 0.003;
    const pitch = -0.7 * sit + (air ? clamp(-(s.vy || 0) * 0.035, -0.3, 0.3) : Math.sin(A.phase * 2) * 0.035 * run);
    body.rotation.x += (pitch - body.rotation.x) * Math.min(1, dt * 12);
    const br = 1 + Math.sin(A.t * (sp > 4 ? 9 : 3)) * 0.012; torso.scale.set(br, br, 1);
    // tail
    const wag = Math.sin(A.t * (7 + happy * 9)) * (0.18 + 0.55 * happy);
    tail.forEach((g, i) => { g.rotation.z = wag * (0.5 + i * 0.25); g.rotation.x = i === 0 ? -1.05 + run * 0.55 - sit * 0.3 : 0.16 - run * 0.1; });
    // ears
    ears.forEach(({ piv, s: sd }) => { piv.rotation.x = -run * 0.5 - Math.abs(Math.sin(A.phase)) * 0.25 * amp; piv.rotation.z = sd * (run * 0.55 + (air ? 0.6 : 0) + Math.sin(A.t * 3 + sd) * 0.03); });
    // head
    A.bark = Math.max(0, A.bark - dt * 4);
    A.lookY += ((s.lookY || 0) - A.lookY) * Math.min(1, dt * 5);
    head.rotation.x = sl * 0.22 + sit * 0.6 + Math.sin(A.t * 1.3) * 0.035 - A.bark * 0.45 - run * 0.12 + (s.lookX || 0);
    head.rotation.y = A.lookY + (sp < 0.3 ? Math.sin(A.t * 0.45) * 0.3 * (1 - sit * 0.5) : 0);
    head.rotation.z = sp < 0.3 ? Math.sin(A.t * 0.31) * 0.08 : 0;
    const pant = sp > 4 || happy > 0.5 || s.pant;
    tongue.scale.z = 2.0 * (pant ? 1 + Math.sin(A.t * 14) * 0.12 : 0.2); tongue.position.y = pant ? -0.0745 : -0.066;
    if (flame) { const f = 0.85 + Math.sin(A.t * 23) * 0.08 + Math.sin(A.t * 37) * 0.07; flame.scale.setScalar(f); }
  }
  animate(0.016, { sit: P.sit || 0 });
  if (P.sit) { for (let i = 0; i < 30; i++) animate(0.05, { sit: 1 }); }

  return { root, body, head, animate, light, flame, bark: () => { A.bark = 1; }, all };
}

<script type="text/plain" id="m-cat">
// Mila – a common grey tabby with a white chest, belly and socks.
import * as THREE from 'three';
import { clamp, lerp, sm } from './textures.js';

export function buildCat(opt = {}) {
  const S = opt.scale || 1.25;
  const gray = new THREE.Color(0x8f9195), dark = new THREE.Color(0x34363b), white = new THREE.Color(0xf5f3ef), pink = new THREE.Color(0xe7a3a0);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.86 });
  const eyeM = new THREE.MeshStandardMaterial({ color: 0xb9c23a, roughness: 0.1 });
  const blackM = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.2 });
  const all = [], cc = new THREE.Color();
  // every part is coloured per vertex: fn(x, y, z, colour) with coordinates in the part's own space
  const paint = (g, fn) => {
    const p = g.attributes.position, c = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) { fn(p.getX(i), p.getY(i), p.getZ(i), cc); c[i * 3] = cc.r; c[i * 3 + 1] = cc.g; c[i * 3 + 2] = cc.b; }
    g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return g;
  };
  const stripes = (x, y, z, f = 62) => sm(0.35, 0.8, 0.5 + 0.5 * Math.sin(z * f + Math.sin(y * 38) * 1.4 + Math.sin(x * 33) * 0.8));
  const tabby = (x, y, z, c, f) => c.copy(gray).lerp(dark, stripes(x, y, z, f) * 0.9);
  const mesh = (g, m = mat) => { const o = new THREE.Mesh(g, m); o.castShadow = true; all.push(o); return o; };
  const ball = (r, fn, x, y, z, sx = 1, sy = 1, sz = 1, m) => {
    const g = new THREE.SphereGeometry(r, 14, 10); g.scale(sx, sy, sz); if (fn) paint(g, fn);
    const o = mesh(g, m || mat); o.position.set(x, y, z); return o;
  };
  const tube = (ra, rb, len, fn) => { const g = new THREE.CylinderGeometry(rb, ra, len, 10, 4); g.translate(0, -len / 2, 0); return mesh(paint(g, fn)); };   // hangs down from its origin

  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const baseY = 0.262; body.position.y = baseY;

  // torso: long ellipsoid, poles along z so the stripes get plenty of vertices
  const tg = new THREE.SphereGeometry(1, 22, 44); tg.rotateX(Math.PI / 2); tg.scale(0.086, 0.094, 0.25);
  paint(tg, (x, y, z, c) => {
    tabby(x, y, z, c);
    if (Math.abs(x) < 0.016 && y > 0) c.lerp(dark, 0.75);                         // dark line along the spine
    const w = Math.max(sm(-0.012, -0.05, y), sm(0.11, 0.19, z) * sm(0.05, -0.02, y));   // white belly and chest
    c.lerp(white, w);
  });
  const torso = mesh(tg); torso.receiveShadow = true; body.add(torso);

  // head
  const head = new THREE.Group(); head.position.set(0, 0.07, 0.262); body.add(head);
  const hg = new THREE.SphereGeometry(0.078, 22, 18); hg.scale(1.04, 0.92, 0.96);
  paint(hg, (x, y, z, c) => {
    c.copy(gray).lerp(dark, sm(0.4, 0.8, 0.5 + 0.5 * Math.sin(x * 150)) * sm(0.01, 0.04, y) * 0.85);   // forehead stripes
    c.lerp(dark, sm(0.3, 0.75, 0.5 + 0.5 * Math.sin(y * 170 + 1)) * sm(0.035, 0.06, Math.abs(x)) * sm(0.02, -0.03, z) * 0.7);   // cheek stripes
    const w = Math.max(sm(0.012, -0.02, y) * sm(0.0, 0.03, z), sm(0.018, 0.004, Math.abs(x)) * sm(0.02, 0.045, z) * sm(0.06, 0.03, y));   // white muzzle, chin and blaze
    c.lerp(white, w);
  });
  head.add(mesh(hg));
  for (const s of [-1, 1]) {
    head.add(ball(0.026, (x, y, z, c) => c.copy(white), s * 0.019, -0.022, 0.062, 1, 0.85, 1));        // whisker pads
    head.add(ball(0.0145, null, s * 0.033, 0.012, 0.062, 1, 1, 0.7, eyeM));
    head.add(ball(0.0075, null, s * 0.034, 0.012, 0.071, 0.45, 1.25, 0.6, blackM));
    const eg = new THREE.ConeGeometry(0.034, 0.062, 4); eg.rotateY(Math.PI / 4); eg.scale(1, 1, 0.55);
    paint(eg, (x, y, z, c) => c.copy(z > 0.004 ? pink : gray).lerp(dark, z > 0.004 ? 0 : 0.25));
    const e = mesh(eg); e.position.set(s * 0.045, 0.078, -0.004); e.rotation.set(-0.12, 0, -s * 0.3); head.add(e);
  }
  head.add(ball(0.019, (x, y, z, c) => c.copy(white), 0, -0.042, 0.048, 1, 0.8, 1));                    // chin
  head.add(ball(0.0075, (x, y, z, c) => c.copy(pink), 0, -0.008, 0.079, 1.3, 0.9, 0.8));                // nose

  // legs: white front legs, grey thighs with white socks behind
  const legs = [];
  const mkLeg = (x, y, z, hind) => {
    const hip = new THREE.Group(); hip.position.set(x, y, z); body.add(hip);
    const lu = 0.105, ll = 0.105;
    hip.add(tube(hind ? 0.04 : 0.027, 0.021, lu, (px, py, pz, c) => { if (hind) tabby(px, py * 1.2, pz, c, 90); else c.copy(white); }));
    if (hind) hip.add(ball(0.045, (px, py, pz, c) => tabby(px, py, pz, c, 80), 0, -0.01, 0.005, 0.8, 1.1, 1.2));
    const knee = new THREE.Group(); knee.position.y = -lu; hip.add(knee);
    knee.add(tube(0.021, 0.017, ll, (px, py, pz, c) => c.copy(white)));
    knee.add(ball(0.022, (px, py, pz, c) => c.copy(white), 0, -ll + 0.004, 0.012, 1, 0.6, 1.4));
    const L = { hip, knee, hind, rest: hind ? -0.3 : 0.05, restK: hind ? 0.6 : 0 }; legs.push(L);
  };
  mkLeg(-0.045, -0.045, 0.155, false); mkLeg(0.045, -0.045, 0.155, false);
  mkLeg(-0.05, -0.035, -0.165, true); mkLeg(0.05, -0.035, -0.165, true);

  // tail: ringed, with a pale tip
  const tail = []; let tp = new THREE.Group(); tp.position.set(0, 0.03, -0.235); body.add(tp);
  for (let i = 0; i < 7; i++) {
    const len = 0.062, g = new THREE.CylinderGeometry(0.02 - i * 0.0012, 0.022 - i * 0.0012, len, 8, 3); g.translate(0, len / 2, 0);
    paint(g, (x, y, z, c) => { if (i === 6 && y > len * 0.4) c.copy(white); else c.copy(gray).lerp(dark, sm(0.3, 0.7, 0.5 + 0.5 * Math.sin((i + y / len) * 4.2)) * 0.9); });
    tp.add(mesh(g)); tail.push(tp); const n = new THREE.Group(); n.position.y = len; tp.add(n); tp = n;
  }
  root.scale.setScalar(S);

  const A = { phase: 0, t: Math.random() * 9, sit: 0, crouch: 0 };
  function animate(dt, s = {}) {
    A.t += dt;
    const sp = s.speed || 0, air = s.grounded === false, run = clamp(sp / 6, 0, 1);
    A.sit += ((s.sit || 0) - A.sit) * Math.min(1, dt * 6); A.crouch += ((s.crouch || 0) - A.crouch) * Math.min(1, dt * 14);
    const sit = A.sit, cr = A.crouch;
    if (sp > 0.2) A.phase += dt * (9 + sp * 1.1);
    const amp = air ? 0 : run;
    const offs = [0, 0.5, Math.PI + 0.2, Math.PI + 0.7];                           // bounding gallop: front pair, then hind pair
    legs.forEach((L, i) => {
      const ph = A.phase + offs[i];
      let h = L.rest - Math.sin(ph) * amp * 1.05, k = L.restK + Math.max(0, Math.cos(ph)) * amp * 1.2;
      if (air) { h = L.hind ? 1.0 : -1.2; k = 0.2; }
      if (cr > 0.01) { h = lerp(h, L.hind ? 1.2 : -1.3, cr); k = lerp(k, 0.15, cr); }
      if (sit > 0.01) { h = lerp(h, L.hind ? -0.75 : 0.72, sit); k = lerp(k, L.hind ? 2.3 : 0, sit); }
      L.hip.rotation.x += (h - L.hip.rotation.x) * Math.min(1, dt * 24);
      L.knee.rotation.x += (k - L.knee.rotation.x) * Math.min(1, dt * 24);
    });
    body.position.y = baseY + Math.abs(Math.sin(A.phase)) * 0.03 * amp - sit * 0.1 - cr * 0.13;
    const pitch = -0.72 * sit + (air ? clamp(-(s.vy || 0) * 0.05, -0.35, 0.35) : Math.sin(A.phase) * 0.09 * amp);
    body.rotation.x += (pitch - body.rotation.x) * Math.min(1, dt * 14);
    head.rotation.x = sit * 0.7 - pitch * 0.5 + cr * 0.2; head.rotation.y = (s.lookY || 0) + (sit > 0.5 ? Math.sin(A.t * 0.6) * 0.25 : 0);
    const up = lerp(-0.35, -1.25, run) + sit * 0.5;                                // tail up when calm, streaming behind at speed
    tail.forEach((g, i) => { g.rotation.x = i === 0 ? up : lerp(0.2, -0.06, run) + Math.sin(A.t * 3 + i) * 0.03; g.rotation.z = Math.sin(A.t * (sit > 0.5 ? 2 : 7) + i * 0.6) * (0.07 + 0.05 * i) * (sit > 0.5 ? 1.5 : 1); });
  }
  animate(0.016, {});
  return { root, body, head, animate, all };
}

// The six relics as 3D models, shared by both levels so they look the same everywhere.
import * as THREE from 'three';

export const RELIC_COLORS = { bone: 0xffc04a, sock: 0x58ff2e, mirror: 0xcfeaff, brush: 0xff8a2e, diaper: 0xff8fd0, ball: 0xa98bff };

export function relicModel(id) {
  const s = new THREE.Group(), add = (g, m) => { const o = new THREE.Mesh(g, m); s.add(o); return o; };
  const gold = new THREE.MeshStandardMaterial({ color: 0xffc84a, metalness: 1, roughness: 0.22, emissive: 0xff9a1a, emissiveIntensity: 0.55 });
  if (id === 'bone') {                      // golden bone
    add(new THREE.CapsuleGeometry(0.075, 0.5, 6, 14), gold).rotation.z = Math.PI / 2;

// Shared pieces for a more natural look (levels 3 and 4): a physically based sky that also lights the scene, tiling
// noise textures, close-up grain and drifting cloud shadows for standard materials, flowing water with sky reflections,

import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';

  for (let y = 0, i = 0; y < n; y++) for (let x = 0; x < n; x++, i += 4) { const v = fn(x / n, y / n); d[i] = v[0] * 255; d[i + 1] = v[1] * 255; d[i + 2] = v[2] * 255; d[i + 3] = 255; }
  ctx.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
export const detailTex = () => dataTex(256, (u, v) => { const a = pfbm(u, v, 16, 3, 4), b = pfbm(u, v, 6, 8, 3); return [clamp01(a + (hash(u * 256, v * 256, 4) - 0.5) * 0.35), b, a]; });

const VERT = (s) => s.replace('#include <common>', '#include <common>\nvarying vec3 vWp;').replace('#include <begin_vertex>', '#include <begin_vertex>\n{ vec4 wp = vec4(transformed, 1.0);\n#ifdef USE_INSTANCING\nwp = instanceMatrix * wp;\n#endif\nvWp = (modelMatrix * wp).xyz; }');

// grain: how strong the close-up grain is (0 = none); cloud: how dark the cloud shadows are (0 = none); cs: their size
export function patchMat(mat, U, { grain = 0, cloud = 0, cs = 0.004, gs = 1 } = {}) {

    s.fragmentShader = s.fragmentShader.replace('#include <common>', HEAD).replace('#include <map_fragment>', '#include <map_fragment>\n'

      + (cloud ? `{ float cs = texture2D(uCloud, vWp.xz * ${cs.toFixed(5)} + uTime * vec2(0.006, 0.002)).r; diffuseColor.rgb *= mix(1.0, ${(1 - cloud).toFixed(3)}, smoothstep(0.5, 0.68, cs)); }` : ''));

export function waterMat(U, { color = 0x2f5a50, flow = 1, scale = 1, strength = 0.2 } = {}) {

    Object.assign(s.uniforms, U); s.vertexShader = VERT(s.vertexShader);

// A physically based daytime sky. `gain` scales what the camera sees, so a level can keep its own exposure.
export function daySky(renderer, scene, sunDir, { gain = 1, size = 800, turbidity = 3.2, rayleigh = 2.0, show = true } = {}) {

  if (gain !== 1) { sky.material.fragmentShader = sky.material.fragmentShader.replace('gl_FragColor = vec4( retColor, 1.0 );', `gl_FragColor = vec4( retColor * ${gain.toFixed(3)}, 1.0 );`); sky.material.needsUpdate = true; }
  sky.scale.setScalar(size); sky.renderOrder = -20; sky.frustumCulled = false; if (show) scene.add(sky); return sky;
}

// ---- vegetation
const v3 = new THREE.Vector3();
const paint = (g, fn) => { const p = g.attributes.position, c = new Float32Array(p.count * 3); for (let i = 0; i < p.count; i++) { const q = fn(p.getX(i), p.getY(i), p.getZ(i)); c[i * 3] = q[0]; c[i * 3 + 1] = q[1]; c[i * 3 + 2] = q[2]; } g.setAttribute('color', new THREE.BufferAttribute(c, 3)); if (g.attributes.uv) g.deleteAttribute('uv'); return g; };
// a lumpy, smooth-shaded mass of leaves; grey vertex colours (darker underneath) that the instance colour tints
export function leafBlob(r, sy = 0.85, s = 1, detail = 1, x = 0, y = 0, z = 0) {
  let g = mergeVertices(new THREE.IcosahedronGeometry(r, detail).deleteAttribute('uv').deleteAttribute('normal')); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { v3.fromBufferAttribute(p, i); const k = 0.9 / r, q = 0.78 + 0.5 * vnoise((v3.x * 0.9 + v3.y * 0.6) * k * 3.7 + s, (v3.z * 0.9 - v3.y * 0.7) * k * 3.7, s); p.setXYZ(i, v3.x * q, v3.y * q * sy, v3.z * q); }
  g.computeVertexNormals(); g = g.toNonIndexed(); g.translate(x, y, z);
  return paint(g, (px, py, pz) => { const q = Math.min(1.1, Math.max(0.25, 0.52 + (py - y) / (r * sy) * 0.42 + (vnoise(px * 1.7 + s, pz * 1.7, 9) - 0.5) * 0.3)); return [q, q, q]; });
}
const trunk = (r, h) => paint(new THREE.CylinderGeometry(r * 0.7, r, h, 6, 1, true).toNonIndexed().translate(0, h / 2, 0), () => [0.42, 0.3, 0.22]);
const cone = (r, h, y, s) => { const g = new THREE.ConeGeometry(r, h, 10, 3, true), p = g.attributes.position; for (let i = 0; i < p.count; i++) { const a = Math.atan2(p.getZ(i), p.getX(i)), q = 1 + (vnoise(a * 2.2 + s, p.getY(i) * 1.3, s) - 0.5) * 0.36; p.setX(i, p.getX(i) * q); p.setZ(i, p.getZ(i) * q); } g.computeVertexNormals(); return paint(g.toNonIndexed().translate(0, y + h / 2, 0), (px, py) => { const q = 0.45 + (py - y) / h * 0.6; return [q, q, q]; }); };
// three kinds, each about 11–15 m tall: a broadleaf, a spruce, a pine
export const treeGeos = () => [
  mergeGeometries([trunk(0.35, 5), leafBlob(3.7, 0.85, 1, 2, 0, 7.2, 0), leafBlob(2.5, 0.9, 5, 1, 1.7, 8.7, 0.9), leafBlob(2.4, 0.85, 9, 1, -1.5, 6.3, -1.1)]),
  mergeGeometries([trunk(0.3, 4), cone(3.3, 6, 2.4, 1), cone(2.7, 5.5, 5.4, 2), cone(2.0, 5, 8.4, 3), cone(1.2, 4.2, 11.4, 4)]),
  mergeGeometries([trunk(0.32, 7), leafBlob(3.4, 0.6, 14, 2, 0, 8.6, 0), leafBlob(2.3, 0.65, 17, 1, 1.3, 10.2, -0.7), leafBlob(2.0, 0.6, 21, 1, -1.4, 7.6, 0.8)]),
];
// list: [x, y, z, kind, scale]; light: how bright the leaves are (lower at night)

<script type="text/plain" id="m-fur">
// High-quality extras shared by the levels. HQ is the switch on the title screen ("High Quality", the default).
// Fur is drawn as a stack of thin shells pushed out along the surface: every shell keeps only the strands that are
// still long enough, and the roots are darker than the tips. All the shells of one body part go out in one draw call.
import * as THREE from 'three';

export const HQ = typeof window === 'undefined' || window.QUALITY !== 'regular';
export const DOG_FUR = { len: 0.0055, density: 620, shells: 10, droop: 0.5 }, CAT_FUR = { len: 0.012, density: 430, shells: 12, droop: 0.7 };
const coarse = typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches, v = new THREE.Vector3(), ident = new THREE.Matrix4();

export function addFur(root, { len, density, shells, droop, min = 0.026 }) {
  if (coarse) shells = Math.ceil(shells / 2);
  const mats = new Map(), meshes = []; root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || !o.material || !o.material.isMeshStandardMaterial || o.material.roughness < 0.7 || o.material.roughness > 0.9) return;
    const g = o.geometry; if (!g.boundingSphere) g.computeBoundingSphere(); o.getWorldScale(v);
    if (g.boundingSphere.radius * Math.max(v.x, v.y, v.z) >= min) meshes.push(o);
  });
  for (const m of meshes) {
    const g = m.geometry; if (!g.attributes.aShell || g.attributes.aShell.count !== shells) g.setAttribute('aShell', new THREE.InstancedBufferAttribute(Float32Array.from({ length: shells }, (_, i) => (i + 1) / shells), 1));
    let e = mats.get(m.material);
    if (!e) {
      const mat = m.material.clone(); mat.roughness = 1; const u = { uLen: { value: len }, uDen: { value: density }, uDroop: { value: droop } };
      mat.onBeforeCompile = (s) => {
        Object.assign(s.uniforms, u);
        s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nattribute float aShell; uniform float uLen, uDroop; varying vec3 vBase; varying float vShell;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvBase = position; vShell = aShell; transformed += normalize(normal) * uLen * aShell; transformed.y -= uLen * aShell * aShell * uDroop;');
        s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>
          uniform float uDen; varying vec3 vBase; varying float vShell;
          float h31(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }`)
          .replace('#include <map_fragment>', `#include <map_fragment>
          { vec3 q = vBase * uDen, c = floor(q); float h = h31(c), d = length(fract(q) - 0.5 - (vec3(h31(c + 7.0), h31(c + 13.0), h31(c + 19.0)) - 0.5) * 0.5);
            if (h * 0.8 + 0.2 < vShell || d > 0.6 * (1.0 - vShell * 0.6)) discard; diffuseColor.rgb *= mix(0.55, 1.1, vShell);
#ifdef USE_COLOR
            if (vColor.r > vColor.g * 1.18 && vColor.r > 0.5) discard;
#endif
          }`);
      };
      mat.userData.chain = true; mat.userData.key = 'fur'; mat.customProgramCacheKey = () => 'fur';
      const skin = m.material.clone(); skin.color.multiplyScalar(0.62);                                    // the skin under the fur is darker, which reads as soft shading
      e = { mat, skin }; mats.set(m.material, e);
    }
    m.material = e.skin; const mat = e.mat;
    const sh = new THREE.InstancedMesh(g, mat, shells); for (let i = 0; i < shells; i++) sh.setMatrixAt(i, ident);
    sh.receiveShadow = true; sh.castShadow = false; sh.frustumCulled = false; m.add(sh);
  }

const SKY_FRAG = `
uniform vec3 uSunDir, uZen, uHor, uGlow, uSunCol, uCloudLit, uCloudDark, uHaze; uniform float uStars, uTime, uEnv;
varying vec3 vDir;
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

export function buildSky(scene, renderer) {

    const a = KEYS[i], b = KEYS[i + 1], k = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))), o = S.cur;

    sun.target.position.copy(base); sun.position.copy(base).addScaledVector(ld, 380); sun.target.updateMatrixWorld();
    const horizonFade = sm(-2.5, 3, el * 180 / Math.PI);
    sun.color.setRGB(...k.sun); sun.intensity = k.sunI * 1.45 * lerp(0.35, 1, horizonFade);
    hemi.color.setRGB(...k.hs); hemi.groundColor.setRGB(...k.hg); hemi.intensity = k.hi * 1.25 * (1 - 0.965 * tun);
    scene.environmentIntensity = 0.55 * (1 - 0.96 * tun) * lerp(1, 0.22, sm(0.55, 0.95, t));

    fogUniforms.uFogColor.value.copy(scene.fog.color); fogUniforms.uFogDensity.value = scene.fog.density;

    for (const { m, mix } of mts) { tmp.setRGB(k.fog[0], k.fog[1], k.fog[2]); m.material.color.setRGB(k.zen[0] * 0.5, k.zen[1] * 0.55, k.zen[2] * 0.6).lerp(tmp, 1 - mix); }
    // water + waterfall + foliage uniforms
    if (world) {
      const w = world.water; w.uSunDir.value.copy(S.sunDir); w.uSunCol.value.copy(sun.color).multiplyScalar(horizonFade); w.uZen.value.setRGB(...k.zen); w.uHor.value.setRGB(...k.hor); w.uGlow.value.setRGB(...k.glow);
      w.uAmb.value.setRGB(k.hs[0] * k.hi + k.sun[0] * k.sunI * 0.12, k.hs[1] * k.hi + k.sun[1] * k.sunI * 0.12, k.hs[2] * k.hi + k.sun[2] * k.sunI * 0.12);

    // the sunset is followed by dimming its intensity instead

  };

      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz; vWNrm = normalize(mat3(modelMatrix) * objectNormal);');

      varying vec3 vWPos; varying vec3 vWNrm;
      uniform sampler2D tRock, tRockN, tGround, tGroundN, tMoss, tNoise, tBlocks, tBlocksN;`)
      .replace('#include <map_fragment>', `
      vec3 wn = normalize(vWNrm) * (gl_FrontFacing ? 1.0 : -1.0);
      ${o.terrain ? `
      if (vWPos.z < ${f(L.TZ0 + 4)} && vWPos.z > ${f(L.TZ1 - 4)} && vWPos.y > 9.03) {
        float ts = clamp((${f(L.TZ0)} - vWPos.z) / ${f(L.TZ0 - L.TZ1)}, 0.0, 1.0);
        float tcx = 8.0 * sin(6.2831853 * ts) * smoothstep(0.0, 0.12, ts) * smoothstep(1.0, 0.88, ts);

      float m2 = texture2D(tNoise, vWPos.zy * 0.011 + vWPos.xy * 0.009).g;
      float m3 = texture2D(tNoise, vWPos.xz * 0.06 + vWPos.y * 0.03).b;

      col = mix(col, grd, topMask);
      float paveM = 0.0;
      ${o.terrain ? `
      float pz = vWPos.z;
      float px = sin(pz * 0.09) * 3.2 * smoothstep(-47.0, -30.0, pz);
      float pathM = (1.0 - smoothstep(0.9, 2.8, abs(vWPos.x - px) + (m3 - 0.5) * 2.2)) * topMask * step(-50.0, pz) * step(pz, 26.0);

      ${o.dirtFloor ? 'col = mix(col, vec3(0.16, 0.115, 0.075) * (0.5 + m3), smoothstep(0.6, 0.9, wn.y));' : ''}

      .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = mix(0.96, 0.4, wet);')

      normal = normalize((viewMatrix * vec4(triN, 0.0)).xyz);`);
  };
  mat.customProgramCacheKey = () => 'tri' + JSON.stringify(o);

}

function foliageMat(map, U, alphaTest = 0.42) {
  const mat = new THREE.MeshStandardMaterial({ map, alphaTest, side: THREE.DoubleSide, vertexColors: true, roughness: 0.72, alphaToCoverage: true });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uSunView = U.uSunView; sh.uniforms.uSunCol = U.uSunCol;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aSway; uniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float wv = sin(uTime * 1.3 + position.x * 0.35 + position.z * 0.27) * 0.6 + sin(uTime * 2.9 + position.y * 0.8 + position.x * 1.3) * 0.25;
        transformed.x += wv * aSway * 0.16; transformed.z += wv * aSway * 0.1; transformed.y += sin(uTime * 2.1 + position.x) * aSway * 0.03;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 uSunView; uniform vec3 uSunCol;')
      .replace('#include <normal_fragment_begin>', 'vec3 normal = normalize(vNormal); vec3 nonPerturbedNormal = normal;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float back = pow(max(dot(-normalize(vViewPosition), uSunView), 0.0), 3.0);
        totalEmissiveRadiance += diffuseColor.rgb * uSunCol * back * 0.5;`);
  };
  mat.customProgramCacheKey = () => 'foliage';
  return mat;
}

// ------------------------------------------------------------------ build
export function buildWorld(scene, tex) {
  const R = rng(20261115);

  {

    const xs = axis(-78, 100, 1.0, -620, 440), zs = axis(-292, 44, 1.0, -520, 260);
    const nx = xs.length, nz = zs.length;
    const pos = new Float32Array(nx * nz * 3);
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) { const k = (j * nx + i) * 3; pos[k] = xs[i]; pos[k + 1] = H(xs[i], zs[j], true); pos[k + 2] = zs[j]; }
    const idx = new Uint32Array((nx - 1) * (nz - 1) * 6); let q = 0;
    for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx - 1; i++) { const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1; idx[q++] = a; idx[q++] = c; idx[q++] = b; idx[q++] = b; idx[q++] = c; idx[q++] = d; }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    // push steep rock faces in and out so the cliffs are craggy rather than smooth
    const nrm = g.attributes.normal;
    for (let k = 0; k < nx * nz; k++) {
      const ny = nrm.getY(k), steep = sm(0.3, 0.75, 1 - ny); if (steep <= 0) continue;
      const x = pos[k * 3], y = pos[k * 3 + 1], z = pos[k * 3 + 2];
      if (z < L.TZ0 + 10 && z > L.TZ1 - 10 && Math.abs(x) < 16 && y < 22) continue;
      if (z < -252 && Math.abs(x) < 24) continue;
      const wl = z > -8 ? 5 * sm(-8, 20, z) : z > -132.4 ? 0 : 9;
      const mask = steep * Math.max(sm(wl + 3, wl + 10, y), sm(wl - 3, wl - 9, y));
      if (mask <= 0) continue;
      let hx = nrm.getX(k), hz = nrm.getZ(k); const hl = Math.hypot(hx, hz) || 1; hx /= hl; hz /= hl;
      const a = (fbm(y * 0.2 + x * 0.05, z * 0.07 + y * 0.09, 3, 77) - 0.5) * 6 * mask;

  }

  // ---------------- water
  {
    const X0 = -220, Z0 = -280, SX = 480, SZ = 360, W = 240, Hh = 180;
    const data = new Uint8Array(W * Hh * 4);
    for (let j = 0; j < Hh; j++) for (let i = 0; i < W; i++) { const d = clamp((L.WATER_Y - H(X0 + (i + 0.5) / W * SX, Z0 + (j + 0.5) / Hh * SZ, true)) / 6, 0, 1); const k = (j * W + i) * 4; data[k] = data[k + 1] = data[k + 2] = d * 255; data[k + 3] = 255; }

      uSunDir: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Color() }, uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uGlow: { value: new THREE.Color() },
      uAmb: { value: new THREE.Color() }, uFoam: { value: new THREE.Color() }, uFixedDepth: { value: -1 },

          vec3 N = normalize(vec3((a.x + b.x * 0.7 + c.x * 0.45) * rough, 1.0, (a.y + b.y * 0.7 + c.y * 0.45) * rough));

          float sd = max(dot(Rf, uSunDir), 0.0);

          float depth = uFixedDepth >= 0.0 ? uFixedDepth : texture2D(tDepth, (p - vec2(${X0}.0, ${Z0}.0)) / vec2(${SX}.0, ${SZ}.0)).r;

          vec3 col = mix(body, sky, fres) + spec;

          float shore = 1.0 - smoothstep(0.0, 0.16, depth);
          float foam = smoothstep(0.55, 0.85, shore * (0.55 + fn * 0.7));
          float dw = length(p - vec2(72.0, -80.0));
          float churn = 1.0 - smoothstep(3.0, 30.0, dw);

    });
    const river = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); river.rotation.x = -Math.PI / 2; river.scale.set(1500, 1500, 1); river.position.set(82 - 750, L.WATER_Y, -100); scene.add(river);
    const mat2 = mat.clone(); mat2.uniforms = { ...uniforms, uFixedDepth: { value: 0.5 } };
    const upper = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat2); upper.rotation.x = -Math.PI / 2; upper.scale.set(170, 16, 1); upper.position.set(76.5 + 85, 21.3, -80); scene.add(upper);

  }

  // ---------------- waterfall
  {
    const fallMat = new THREE.ShaderMaterial({
      uniforms: { tNoise: { value: tex.noise }, uTime: U.uTime, uLight: { value: new THREE.Color(1, 1, 1) }, uFogColor: fogUniforms.uFogColor, uFogDensity: fogUniforms.uFogDensity },
      transparent: true, depthWrite: false, side: THREE.DoubleSide,

      fragmentShader: `uniform sampler2D tNoise; uniform float uTime, uFogDensity; uniform vec3 uLight, uFogColor; varying vec2 vUv; varying float vD;

      fragmentShader: `uniform float uA; varying vec2 vUv; void main(){ vec2 q = vUv - vec2(0.5, 0.0); float r = length(q) * 2.0; float t = (r - 0.8) / 0.14;

    for (let i = 0; i < 26; i++) rock(-22 + R() * 90, -57 - R() * 30, 1.5 + R() * 3.2, 0.1);
    for (let i = 0; i < 10; i++) rock(62 + R() * 9, -74 - R() * 12, 1.5 + R() * 2.5, 0.1);

  if (G.chimney && Math.random() < dt * 6) pAlpha.spawn(G.chimney.x, G.chimney.y, G.chimney.z, 0.5, 1 + Math.random() * 0.6, 0, 4, 0.6, 3, 0.8, 0.8, 0.84, 0.32, -0.15, 0.2);
  // ---- bones
  let n = 0; const ps = prog();
  for (const it of items) { if (it.got || n >= 90) continue; const s = it.ice ? -it.z : it.s; if (s < ps - 6 || s > ps + 130) continue; const x = it.ice ? it.x : cx(it.s) + it.u, y = (it.ice ? 0 : ground(it.s, it.u)) + it.h;
    dummy.position.set(x, y + Math.sin(G.t * 3 + s) * 0.06, -s); dummy.rotation.set(0.3, G.t * 3 + s * 0.4, 0.5); dummy.scale.setScalar(1.7); dummy.updateMatrix(); boneMesh.setMatrixAt(n++, dummy.matrix); }
  boneMesh.count = n; boneMesh.instanceMatrix.needsUpdate = true;
  pAdd.update(dt); pAlpha.update(dt);
  // ---- camera, light
  const sh = G.shake * G.shake * 0.5, tall = camera.aspect < 1 ? 1 : 0; let px, py, pz;
  if (title) { const a = G.t * 0.12 + 0.7; px = cx(0); py = G.y; pz = 0; camera.position.set(px + Math.sin(a) * 6.5, py + 2.3, pz + Math.cos(a) * 6.5 + 1); camera.lookAt(px, py + 0.5, pz - 2); }
  else if (win) { px = FX; pz = FZ; py = fire.position.y; const a = 0.4 + G.endT * 0.17; camera.position.lerp(tmpV.set(px + Math.sin(a) * (9 + tall * 3), py + 3.2, pz + Math.cos(a) * (9 + tall * 3) + 2), Math.min(1, dt * 1.5)); camera.lookAt(px, py + 0.9, pz + 0.6); }
  else if (G.phase === 'sled') { px = cx(G.s) + G.u; py = G.y; pz = -G.s; const hd = Math.atan(headAt(G.s)), back = 5.4 + tall * 3 + G.v * 0.07, cs = G.s - back * Math.cos(hd), cu = G.u * 0.75, cxw = cx(cs) + cu;
    tmpV.set(cxw, Math.max(py + 2.1 + tall, ground(cs, cu) + 1.5), -cs); camera.position.lerp(tmpV, Math.min(1, dt * 7)); camera.position.x += (Math.random() - 0.5) * sh; camera.position.y += (Math.random() - 0.5) * sh;
    const ls = G.s + 9; camera.lookAt(cx(ls) + G.u * 0.6, trackY(ls) + 1.1, -ls); camera.rotateZ(-G.uv * 0.012); }
  else { px = P.x; py = 0; pz = P.z; camera.position.lerp(tmpV.set(lerp(P.x, CXI, 0.25), 5.2 + tall * 2, P.z + 8.2 + tall * 2.5), Math.min(1, dt * 5)); camera.position.x += (Math.random() - 0.5) * sh; camera.lookAt(lerp(P.x, CXI, 0.15), 0.4, P.z - 6); }
  const fov = 62 + (tall ? 8 : 0) + (G.phase === 'sled' && play ? clamp((G.v - 12) * 0.75, 0, 14) : 0); if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
  G.sky.position.copy(camera.position); flakeU.uCam.value.copy(camera.position); flakeU.uSize.value = renderer.domElement.height / 700;
  sun.target.position.set(px, py, pz - 6); sun.position.copy(sun.target.position).addScaledVector(SUN, 90);
  hud(); if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').style.opacity = 0; } if (pickT > 0) { pickT -= dt; if (pickT <= 0) $('pick').style.opacity = 0; }
  if (audio.on) { audio.musicRun({ play, soft: win, stage: G.phase === 'ice' ? 1 : 0 }); if (audio.wind) audio.wind.g.gain.setTargetAtTime(play && G.phase === 'sled' ? 0.05 + G.v * 0.012 : 0.06, audio.ctx.currentTime, 0.3); }
}
// plays the level by itself (testing): follows the clear line and brakes on the hill; on the ice keeps its speed down and steers round what is dangerous
function bot() {
  if (G.phase === 'sled') { let next = rows.find((r) => r.s > G.s + 2), prev = null; for (const r of rows) { if (r.s <= G.s + 2) prev = r; } const tgt = next ? (prev ? lerp(prev.safe, next.safe, clamp((G.s - prev.s) / (next.s - prev.s), 0, 1) ** 0.6) : next.safe) : 0;
    input.x = clamp((tgt - G.u) * 0.9 - G.uv * 0.25, -1, 1); input.brake = G.v > 19 && G.s < S1 - 40; if (next && next.log && next.s - G.s < G.v * 0.3 && !G.air) hop(); return; }
  let dx = (CXI - P.x) * 0.04, dz = -1; for (const q of haz) { if (q.type === 'snow') continue; const ox = P.x - q.x, oz = P.z - q.z, d = Math.hypot(ox, oz), reach = q.r + 6; if (d < reach && oz > -q.r - 1) { const k = (reach - d) / reach * 3.2; dx += (ox >= 0 ? 1 : -1) * k * (1.2 - Math.abs(ox) / reach); } }
  for (const k of skaters) { const oz = P.z - k.z; if (oz > 0 && oz < 7 && Math.abs(k.x - P.x) < 4) dz = 0.6; }
  const want = 6.5, wx = clamp(dx, -1.4, 1.4) * 4, wz = dz * want; input.x = clamp((wx - P.vx) * 0.5, -1, 1); input.y = clamp(-(wz - P.vz) * 0.5, -1, 1); input.brake = false;
}

let last = 0, fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  if (document.hidden) return;
  step(dt); draw();
  fpsAcc += dt; fpsN++; if (fpsAcc > 2.5) { if (fpsAcc / fpsN > 0.03 && pixelRatio > 0.7) { pixelRatio = Math.max(0.7, pixelRatio * 0.85); resize(); } fpsAcc = 0; fpsN = 0; }
}
async function boot() {
  document.body.classList.add('sled'); if (isTouch) document.body.classList.add('touch');
  await new Promise((r) => setTimeout(r, 30));
  tex = createTextures();
  buildWorld(); buildCourse();
  dog = buildDog(tex, {}); cat = buildCat({ scale: 1.15 }); if (HQ) { addFur(dog.root, DOG_FUR); addFur(cat.root, CAT_FUR); }
  for (let i = 0; i < 4; i++) { const d = buildDog(tex, { scale: 0.43, head: 1.3, leg: 0.8, ear: 1.15, snout: 0.72 }); scene.add(d.root); puppies.push({ d, x: 0, z: 0 }); }
  pAdd = new Particles(500, true); pAlpha = new Particles(900, false); scene.add(pAdd.mesh, pAlpha.mesh);
  $('rCat').textContent = '🔥'; $('rCat').style.left = '100%';
  reset(); G.mode = 'title'; applyLang();
  $('start').addEventListener('click', startGame);
  $('lang').addEventListener('click', () => { lang = lang === 'pl' ? 'en' : 'pl'; applyLang(); });
  $('again').addEventListener('click', () => { const bt = G.bot; toTitle(); G.bot = bt; startGame(); });
  $('menu').addEventListener('click', toTitle);
  step(0.016); renderer.compile(scene, camera); draw();
  window.__sled = { G, P, Mi, obs, rows, items, balls, haz, skaters, input, audio, step, startGame, reset, toTitle, hop, renderer, scene, camera, cx, half, ground, S1, S2, ICE0, CXI,
    sim: (secs, dt = 1 / 60) => { for (let t = 0; t < secs; t += dt) step(dt); draw(); return { mode: G.mode, phase: G.phase, s: +prog().toFixed(0), u: +G.u.toFixed(1), v: +G.v.toFixed(1), lives: G.lives, bones: G.bones, time: +G.time.toFixed(0) }; } };
  $('title').classList.remove('hidden'); $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 1100);
  last = performance.now(); requestAnimationFrame(frame);
}
boot().catch((e) => { console.error(e); $('loading').textContent = 'Błąd: ' + e.message; });
